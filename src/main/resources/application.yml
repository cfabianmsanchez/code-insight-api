server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: code-insight-api

  # Límites de subida de archivos (ZIP de repositorios)
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

# OpenAPI Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.codeinsight.api: DEBUG

# Ollama Local LLM Configuration
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5-coder}
  available-models: ${OLLAMA_AVAILABLE_MODELS:qwen2.5-coder,llama3,deepseek-coder,codellama,mistral}

# AI Prompt Templates Configuration
ai:
  prompts:
    architecture-version: v1

