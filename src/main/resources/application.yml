server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: code-insight-api

# OpenAPI Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.codeinsight.api: DEBUG
